# Based on dockette/web's default site, with the document root moved to public/
upstream app {
    server unix:/var/run/php-fpm.sock;
}

server {
  listen 80;
  index index.php;
  root /srv/public/;

  location / {
    try_files $uri /index.php$is_args$args;
  }

  # dotfiles such as .htaccess
  location ~ /\. {
    deny all;
  }

  location = /index.php {
    fastcgi_pass   app;
    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param  DOCUMENT_ROOT $realpath_root;
  }

  # no other PHP file in public/ may run
  location ~* \.php$ {
    return 404;
  }
}
