# Production: docker compose -f docker-compose.prod.yml up -d
# Deploy a new version: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:

  web:
    image: ghcr.io/tomkeb/plant-systematics:master
    container_name: katedra
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      # the SleekDB database (pages, news, theses, photos, users) and the uploaded photo files,
      # bind-mounted from next to this file so they outlive the container and can be synced
      # with local dev (e.g. via rsync); the folders must be writable by www-data (uid 33):
      #   mkdir -p data public/uploads/photos && chown -R 33:33 data public/uploads
      - ./data:/srv/data
      - ./public/uploads:/srv/public/uploads
